name: Fix Agrifarm SEO and email
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix URLs, forms, sitemap and robots
        shell: python
        run: |
          from pathlib import Path
          import re

          base = 'https://agrifarm-plc.netlify.app'
          pages = {'index.html': '/', 'about.html': '/about.html', 'products.html': '/products.html', 'contact.html': '/contact.html'}

          for name, path in pages.items():
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              canonical = f'{base}{path}'
              if 'rel="canonical"' in s:
                  s = re.sub(r'(<link\s+rel="canonical"\s+href=")[^"]+("\s*/?>)', rf'\g<1>{canonical}\g<2>', s, count=1)
              else:
                  s = re.sub(r'(<title>.*?</title>)', rf'\1\n<link rel="canonical" href="{canonical}" />', s, count=1, flags=re.S)
              s = re.sub(r'https://formsubmit\.co/[^"\']+', 'mailto:agrifarmcoffeeexport@gmail.com', s)
              p.write_text(s, encoding='utf-8')

          Path('robots.txt').write_text(f'User-agent: *\nAllow: /\n\nSitemap: {base}/sitemap.xml\n', encoding='utf-8')
          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://agrifarm-plc.netlify.app/</loc></url>\n  <url><loc>https://agrifarm-plc.netlify.app/about.html</loc></url>\n  <url><loc>https://agrifarm-plc.netlify.app/products.html</loc></url>\n  <url><loc>https://agrifarm-plc.netlify.app/contact.html</loc></url>\n</urlset>\n''', encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/seo-fix.yml
          git add index.html about.html products.html contact.html robots.txt sitemap.xml .github/workflows/seo-fix.yml
          git commit -m "Fix Netlify canonical URLs and email forms" || exit 0
          git push origin main
