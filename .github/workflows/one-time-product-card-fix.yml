name: One-time product card fix

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-product-card-fix
  cancel-in-progress: true

jobs:
  fix-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix product cards
        shell: python
        run: |
          from pathlib import Path

          p = Path("products.html")
          s = p.read_text(encoding="utf-8")

          # Remove the Red Hanging Poultry Drinker card using its unique image.
          img = 'src="https://www.2merkato.com/images/mtree/listings/m/39774.jpg"'
          if img in s:
              i = s.index(img)
              start = s.rfind('      <div class="order-card', 0, i)
              checkbox = '<input type="checkbox" class="order-checkbox sr-only" name="Order" value="Red Hanging Poultry Drinker" tabindex="-1" />'
              end = s.index(checkbox, i) + len(checkbox)
              end = s.index('</div>', end) + len('</div>')
              s = s[:start] + s[end:]

          # Rename existing sprayers everywhere, including price keys and checkboxes.
          s = s.replace('KNAPSACK AK Sprayer', 'AK KNAPSACK SPRAYER')
          s = s.replace('Yellow Backpack Sprayer', 'Ethio KNAPSACK AK Sprayer')
          s = s.replace('Ethio AK KNAPSACK SPRAYER', 'Ethio KNAPSACK AK Sprayer')

          # Add the requested Agrifam KNAPSACK Sprayer to Farm Hardware.
          if 'data-price-for="Agrifam KNAPSACK Sprayer"' not in s:
              section = s.index('FARM HARDWARE & LOGISTICS')
              marker = '      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">\n'
              idx = s.index(marker, section) + len(marker)
              card = '''      <div class="order-card reveal relative rounded-2xl border-2 border-line bg-white overflow-hidden" style="transition-delay:120ms">
        <button type="button" class="order-card-trigger block w-full text-left">
          <div class="relative">
            <img draggable="false" class="photo w-full h-52 object-cover" src="https://www.2merkato.com/images/mtree/listings/m/39773.jpg" alt="Agrifam KNAPSACK Sprayer supplied by Agrifarm" loading="lazy" />
            <span class="order-badge absolute top-3 right-3 items-center gap-1 rounded-full bg-forest text-white text-xs font-semibold px-3 py-1.5 shadow-lg">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              <span data-lang="en">Added</span><span data-lang="am">ታክሏል</span>
            </span>
          </div>
          <div class="p-6">
            <h3 class="font-display font-semibold text-lg text-forest mb-2"><span data-lang="en">Agrifam KNAPSACK Sprayer</span><span data-lang="am">Agrifam KNAPSACK Sprayer</span></h3>
            <p class="text-sm text-ink-soft leading-relaxed"><span data-lang="en">A hanging drinker that keeps water clean and off the coop floor.</span><span data-lang="am">ውሃን ንጹህ አድርጎ ከዶሮ ቤት ወለል ላይ የሚያቆይ የሚንጠለጠል ማጠጫ።</span></p>
            <p class="order-price hidden mt-2 text-base font-semibold text-sky" data-price-for="Agrifam KNAPSACK Sprayer"></p>
            <p class="mt-4 text-sm font-semibold text-forest flex items-center gap-1.5">
              <span class="order-cta-add"><span data-lang="en">Tap to view &amp; add</span><span data-lang="am">ለመመልከት እና ለማዘዝ ይንኩ</span></span>
              <span class="order-cta-added"><span data-lang="en">✓ In your order — tap to view</span><span data-lang="am">✓ በትዕዛዝዎ ውስጥ — ለመመልከት ይንኩ</span></span>
            </p>
          </div>
        </button>
        <input type="checkbox" class="order-checkbox sr-only" name="Order" value="Agrifam KNAPSACK Sprayer" tabindex="-1" />
      </div>
'''
              s = s[:idx] + card + s[idx:]

          p.write_text(s, encoding="utf-8")

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html
          git rm .github/workflows/one-time-product-card-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Update farm hardware product cards"
          git push
