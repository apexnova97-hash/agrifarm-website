name: Apply Agrifarm product update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update products.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('products.html')
          s = p.read_text(encoding='utf-8')

          pattern = r'<div class="order-card reveal relative rounded-2xl border-2 border-line bg-white overflow-hidden" style="transition-delay:120ms">\s*<button type="button" class="order-card-trigger block w-full text-left">.*?<input type="checkbox" class="order-checkbox sr-only" name="Order" value="Red Hanging Poultry Drinker" tabindex="-1" />\s*</div>'
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Red Hanging Poultry Drinker card was not found exactly once.')
          s = s2

          farm_start = s.find('<div class="reveal">\n      <p class="chip text-forest mb-4"><span data-lang="en">FARM HARDWARE & LOGISTICS</span>')
          if farm_start < 0:
              raise SystemExit('FARM HARDWARE & LOGISTICS section not found.')
          farm_end = s.find('\n    </div>\n  </section>\n\n  <!-- ==================== COMPLETE YOUR ORDER ==================== -->', farm_start)
          if farm_end < 0:
              raise SystemExit('End of FARM HARDWARE & LOGISTICS section not found.')
          farm_end += len('\n    </div>')

          farm_block = r'''<div class="reveal">
      <p class="chip text-forest mb-4"><span data-lang="en">FARM HARDWARE & LOGISTICS</span><span data-lang="am">የእርሻ እቃዎች እና ትራንስፖርት</span></p>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="order-card reveal relative rounded-2xl border-2 border-line bg-white overflow-hidden" style="transition-delay:120ms">
          <button type="button" class="order-card-trigger block w-full text-left">
            <div class="relative">
              <img draggable="false" class="photo w-full h-52 object-cover" src="https://www.2merkato.com/images/mtree/listings/m/39773.jpg" alt="Agrifam KNAPSACK Sprayer supplied by Agrifarm" loading="lazy" />
              <span class="order-badge absolute top-3 right-3 items-center gap-1 rounded-full bg-forest text-white text-xs font-semibold px-3 py-1.5 shadow-lg">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                <span data-lang="en">Added</span><span data-lang="am">ታክሏል</span>
              </span>
            </div>
            <div class="p-6">
              <h3 class="font-display font-semibold text-lg text-forest mb-2"><span data-lang="en"></span>Agrifam KNAPSACK Sprayer<span data-lang="am">Agrifam KNAPSACK Sprayer</span></h3>
              <p class="text-sm text-ink-soft leading-relaxed"><span data-lang="en">A hanging drinker that keeps water clean and off the coop floor.</span><span data-lang="am">ውሃን ንጹህ አድርጎ ከዶሮ ቤት ወለል ላይ የሚያቆይ የሚንጠለጠል ማጠጫ።</span></p>
              <p class="order-price hidden mt-2 text-base font-semibold text-sky" data-price-for="Agrifam KNAPSACK Sprayer"></p>
              <p class="mt-4 text-sm font-semibold text-forest flex items-center gap-1.5">
                <span class="order-cta-add"><span data-lang="en">Tap to view &amp; add</span><span data-lang="am">ለመመልከት እና ለማዘዝ ይንኩ</span></span>
                <span class="order-cta-added"><span data-lang="en">✓ In your order — tap to view</span><span data-lang="am">✓ በትዕዛዝዎ ውስጥ — ለመመልከት ይንኩ</span></span>
              </p>
            </div>
          </button>
          <input type="checkbox" class="order-checkbox sr-only" name="Order" value="Agrifam KNAPSACK Sprayer" tabindex="-1" />
        </div>
        <div class="order-card reveal relative rounded-2xl border-2 border-line bg-white overflow-hidden">
          <button type="button" class="order-card-trigger block w-full text-left">
            <div class="relative">
              <img draggable="false" class="photo w-full h-52 object-cover" src="https://www.2merkato.com/images/mtree/listings/m/39777.jpg" alt="AK KNAPSACK Sprayer supplied by Agrifarm" loading="lazy" />
              <span class="order-badge absolute top-3 right-3 items-center gap-1 rounded-full bg-forest text-white text-xs font-semibold px-3 py-1.5 shadow-lg">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                <span data-lang="en">Added</span><span data-lang="am">ታክሏል</span>
              </span>
            </div>
            <div class="p-6">
              <h3 class="font-display font-semibold text-lg text-forest mb-2">AK KNAPSACK Sprayer</h3>
              <p class="text-sm text-ink-soft leading-relaxed"><span data-lang="en">A manual knapsack sprayer for even application of crop protection products.</span><span data-lang="am">የሰብል መከላከያ ምርቶችን በእኩል ደረጃ ለመርጨት የሚያገለግል በእጅ የሚሰራ የጀርባ መርጫ።</span></p>
              <p class="order-price hidden mt-2 text-base font-semibold text-sky" data-price-for="AK KNAPSACK Sprayer"></p>
              <p class="mt-4 text-sm font-semibold text-forest flex items-center gap-1.5">
                <span class="order-cta-add"><span data-lang="en">Tap to view &amp; add</span><span data-lang="am">ለመመልከት እና ለማዘዝ ይንኩ</span></span>
                <span class="order-cta-added"><span data-lang="en">✓ In your order — tap to view</span><span data-lang="am">✓ በትዕዛዝዎ ውስጥ — ለመመልከት ይንኩ</span></span>
              </p>
            </div>
          </button>
          <input type="checkbox" class="order-checkbox sr-only" name="Order" value="AK KNAPSACK Sprayer" tabindex="-1" />
        </div>
        <div class="order-card reveal relative rounded-2xl border-2 border-line bg-white overflow-hidden" style="transition-delay:60ms">
          <button type="button" class="order-card-trigger block w-full text-left">
            <div class="relative">
              <img draggable="false" class="photo w-full h-52 object-cover" src="https://www.2merkato.com/images/mtree/listings/m/39775.jpg" alt="ETHIO KNAPSACK Sprayer supplied by Agrifarm" loading="lazy" />
              <span class="order-badge absolute top-3 right-3 items-center gap-1 rounded-full bg-forest text-white text-xs font-semibold px-3 py-1.5 shadow-lg">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                <span data-lang="en">Added</span><span data-lang="am">ታክሏል</span>
              </span>
            </div>
            <div class="p-6">
              <h3 class="font-display font-semibold text-lg text-forest mb-2"><span data-lang="en">ETHIO KNAPSACK Sprayer</span><span data-lang="am">ETHIO KNAPSACK Sprayer</span></h3>
              <p class="text-sm text-ink-soft leading-relaxed"><span data-lang="en">A backpack-style sprayer built for all-day comfort during field spraying.</span><span data-lang="am">በእርሻ ላይ ቀኑን ሙሉ ምቾት እንዲኖር ተደርጎ የተሰራ የጀርባ መርጫ።</span></p>
              <p class="order-price hidden mt-2 text-base font-semibold text-sky" data-price-for="ETHIO KNAPSACK Sprayer"></p>
              <p class="mt-4 text-sm font-semibold text-forest flex items-center gap-1.5">
                <span class="order-cta-add"><span data-lang="en">Tap to view &amp; add</span><span data-lang="am">ለመመልከት እና ለማዘዝ ይንኩ</span></span>
                <span class="order-cta-added"><span data-lang="en">✓ In your order — tap to view</span><span data-lang="am">✓ በትዕዛዝዎ ውስጥ — ለመመልከት ይንኩ</span></span>
              </p>
            </div>
          </button>
          <input type="checkbox" class="order-checkbox sr-only" name="Order" value="ETHIO KNAPSACK Sprayer" tabindex="-1" />
        </div>
      </div>
    </div>'''

          s = s[:farm_start] + farm_block + s[farm_end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit product changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/product-edit.yml
          git add products.html .github/workflows/product-edit.yml
          git commit -m "Update farm hardware sprayer products" || exit 0
          git push origin main
